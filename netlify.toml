# Netlify configuration for Next.js App Router deployment.
# Only the frontend/ dashboard deploys here -- the Python backend
# (scraper, Playwright automation, Gmail scanning) is local-first per
# the plan's design and is not deployed by this config.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "frontend/.next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"
